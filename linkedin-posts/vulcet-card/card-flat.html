<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vulcet — Black Card Flat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: #111; }
    .frame {
      width: 1400px;
      height: 900px;
      display: grid;
      place-items: center;
      background: #f2eee6;
    }
    .card-wrap {
      width: 1011px;
      height: 638px;
      filter: drop-shadow(0 28px 48px rgba(23,23,21,.22));
    }
    .card {
      width: 100%;
      height: 100%;
      border-radius: 32px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(120% 85% at 12% -10%, rgba(255,255,255,.09), transparent 40%),
        linear-gradient(150deg, #161614 0%, #0b0b0a 48%, #050505 100%);
      border: 1px solid rgba(255,255,255,.08);
    }
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -1px 0 rgba(0,0,0,.4);
      pointer-events: none;
    }
    .etch { position: absolute; inset: 0; }
    .etch svg { width: 100%; height: 100%; }
    .chip {
      position: absolute; left: 92px; top: 198px; width: 90px; height: 70px;
      border-radius: 12px;
      background: linear-gradient(145deg, #ddd8cf 0%, #b8b1a4 38%, #efebe3 58%, #9c9588 100%);
      box-shadow: 0 1px 0 rgba(255,255,255,.4), 0 8px 16px rgba(0,0,0,.4), inset 0 0 0 1px rgba(0,0,0,.2);
      overflow: hidden;
    }
    .chip::before {
      content: ""; position: absolute; inset: 0;
      background:
        linear-gradient(#8a8376,#8a8376) 50% 0/1px 100% no-repeat,
        linear-gradient(#8a8376,#8a8376) 0 32%/100% 1px no-repeat,
        linear-gradient(#8a8376,#8a8376) 0 68%/100% 1px no-repeat,
        linear-gradient(#8a8376,#8a8376) 27% 0/1px 100% no-repeat,
        linear-gradient(#8a8376,#8a8376) 73% 0/1px 100% no-repeat;
      opacity: .5;
    }
    .wordmark {
      position: absolute; top: 64px; right: 76px; width: 300px; height: auto;
      filter: invert(1) brightness(1.08); opacity: .97;
    }
    .contactless { position: absolute; left: 206px; top: 210px; width: 32px; height: 42px; opacity: .58; }
    .mastercard {
      position: absolute; right: 76px; bottom: 58px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .mc-marks { position: relative; width: 100px; height: 60px; }
    .mc-marks i { position: absolute; top: 0; width: 60px; height: 60px; border-radius: 50%; }
    .mc-marks i:first-child { left: 0; background: linear-gradient(160deg,#e2ddd4,#a8a195 55%,#d2cdc3); opacity:.9; }
    .mc-marks i:last-child { right: 0; background: linear-gradient(160deg,#c9c2b7,#8f877b 55%,#b8b1a5); opacity:.82; }
    .mastercard span { font-size: 15px; font-weight: 500; letter-spacing: .03em; color: rgba(214,209,199,.72); }
    .fine {
      position: absolute; left: 92px; bottom: 68px;
      font-size: 13px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase;
      color: rgba(214,209,199,.38);
    }
  </style>
</head>
<body>
  <div class="frame" id="shot">
    <div class="card-wrap">
      <div class="card">
        <div class="etch" aria-hidden="true">
          <svg viewBox="0 0 1011 638" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#f5f1e8" stop-opacity=".72"/>
                <stop offset="40%" stop-color="#c9c2b7" stop-opacity=".38"/>
                <stop offset="100%" stop-color="#efebe3" stop-opacity=".65"/>
              </linearGradient>
            </defs>
            <path d="M-60 580 C 20 90, 280 -70, 600 70" stroke="url(#silver)" stroke-width="1.5"/>
            <path d="M-10 600 C 70 130, 310 -30, 630 100" stroke="url(#silver)" stroke-width="1.15" opacity=".55"/>
            <path d="M100 650 L 970 25" stroke="url(#silver)" stroke-width="1.4"/>
            <path d="M145 665 L 1015 40" stroke="url(#silver)" stroke-width="1" opacity=".42"/>
            <path d="M690 -40 C 880 70, 970 240, 1030 460" stroke="url(#silver)" stroke-width="1.15" opacity=".4"/>
          </svg>
        </div>
        <img class="wordmark" src="./vulcet-wordmark.png" alt="Vulcet">
        <div class="chip"></div>
        <svg class="contactless" viewBox="0 0 24 32" fill="none">
          <path d="M8 8c3.5 3 3.5 13 0 16" stroke="#c9c2b7" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M12.5 5c5 4.2 5 17.6 0 22" stroke="#c9c2b7" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M17 2c6.5 5.5 6.5 22 0 28" stroke="#c9c2b7" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <div class="fine">Vulcet</div>
        <div class="mastercard"><div class="mc-marks"><i></i><i></i></div><span>mastercard</span></div>
      </div>
    </div>
  </div>
</body>
</html>
