<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vulcet — Black Metal Card Flat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: #111; }
    .frame {
      width: 1400px;
      height: 900px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 80% 60% at 50% 50%, #1a1916, #0e0d0c 70%, #090908 100%);
    }
    .card-wrap {
      width: 1040px;
      height: 656px;
      filter: drop-shadow(0 40px 70px rgba(0,0,0,.55));
    }
    .card {
      width: 100%;
      height: 100%;
      border-radius: 30px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(105deg,
          rgba(255,255,255,.00) 0%,
          rgba(255,255,255,.05) 30%,
          rgba(255,255,255,.00) 45%,
          rgba(255,255,255,.03) 62%,
          rgba(255,255,255,.00) 78%,
          rgba(255,255,255,.045) 92%,
          rgba(255,255,255,.00) 100%),
        radial-gradient(120% 90% at 8% -20%, rgba(255,255,255,.12), transparent 38%),
        linear-gradient(155deg, #1c1c1a 0%, #10100e 35%, #080808 70%, #050505 100%);
      border: 1px solid rgba(201,194,183,.2);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -1px 0 rgba(0,0,0,.5);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,.08), transparent 35%, transparent 65%, rgba(0,0,0,.2));
      pointer-events: none;
      z-index: 1;
    }
    .etch { position: absolute; inset: 0; z-index: 0; }
    .etch svg { width: 100%; height: 100%; }
    .chip {
      position: absolute; left: 96px; top: 220px; width: 94px; height: 72px;
      border-radius: 11px; z-index: 2;
      background: linear-gradient(145deg, #f0ebe2 0%, #c9c2b7 22%, #ebe6dc 40%, #a8a195 58%, #ddd7cd 78%, #9a9386 100%);
      box-shadow: 0 1px 0 rgba(255,255,255,.45), 0 10px 22px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.22), inset 0 2px 3px rgba(255,255,255,.35);
      overflow: hidden;
    }
    .chip::before {
      content: ""; position: absolute; inset: 0;
      background:
        linear-gradient(rgba(90,84,74,.55), rgba(90,84,74,.55)) 50% 0 / 1.2px 100% no-repeat,
        linear-gradient(rgba(90,84,74,.55), rgba(90,84,74,.55)) 0 30% / 100% 1.2px no-repeat,
        linear-gradient(rgba(90,84,74,.55), rgba(90,84,74,.55)) 0 70% / 100% 1.2px no-repeat,
        linear-gradient(rgba(90,84,74,.55), rgba(90,84,74,.55)) 26% 0 / 1.2px 100% no-repeat,
        linear-gradient(rgba(90,84,74,.55), rgba(90,84,74,.55)) 74% 0 / 1.2px 100% no-repeat;
      opacity: .7;
    }
    .chip::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,.35), transparent 40%, transparent 60%, rgba(255,255,255,.12));
    }
    .wordmark {
      position: absolute; top: 68px; right: 80px; width: 310px; height: auto; z-index: 2;
      filter: invert(1) brightness(1.05) drop-shadow(0 1px 0 rgba(255,255,255,.15)) drop-shadow(0 0 12px rgba(242,238,230,.12));
      opacity: .98;
    }
    .contactless {
      position: absolute; left: 218px; top: 234px; width: 34px; height: 44px; opacity: .62; z-index: 2;
      filter: drop-shadow(0 0 4px rgba(201,194,183,.25));
    }
    .mastercard {
      position: absolute; right: 80px; bottom: 62px;
      display: flex; flex-direction: column; align-items: center; gap: 11px; z-index: 2;
    }
    .mc-marks { position: relative; width: 104px; height: 64px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
    .mc-marks i { position: absolute; top: 0; width: 64px; height: 64px; border-radius: 50%; }
    .mc-marks i:first-child {
      left: 0;
      background: radial-gradient(circle at 30% 28%, #f4efe6, #c9c2b7 45%, #8f877b 100%);
      opacity: .92;
    }
    .mc-marks i:last-child {
      right: 0;
      background: radial-gradient(circle at 35% 30%, #ddd7cd, #a8a195 48%, #6f695f 100%);
      opacity: .78;
    }
    .mastercard span {
      font-size: 14px; font-weight: 500; letter-spacing: .06em; color: rgba(201,194,183,.55);
    }
  </style>
</head>
<body>
  <div class="frame" id="shot">
    <div class="card-wrap">
      <div class="card">
        <div class="etch" aria-hidden="true">
          <svg viewBox="0 0 1040 656" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#f7f3ea" stop-opacity=".85"/>
                <stop offset="35%" stop-color="#c9c2b7" stop-opacity=".42"/>
                <stop offset="70%" stop-color="#ebe6dc" stop-opacity=".55"/>
                <stop offset="100%" stop-color="#a8a195" stop-opacity=".7"/>
              </linearGradient>
              <linearGradient id="foilSoft" x1="1" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#efebe3" stop-opacity=".5"/>
                <stop offset="100%" stop-color="#c9c2b7" stop-opacity=".15"/>
              </linearGradient>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="0.6" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <g filter="url(#glow)" stroke-linecap="round">
              <path d="M-80 600 C 0 50, 300 -110, 670 55" stroke="url(#foil)" stroke-width="1.7"/>
              <path d="M-40 620 C 55 90, 335 -75, 700 90" stroke="url(#foil)" stroke-width="1.2" opacity=".55"/>
              <path d="M15 640 C 110 135, 370 -40, 730 125" stroke="url(#foilSoft)" stroke-width=".95" opacity=".4"/>
              <path d="M80 680 L 1020 15" stroke="url(#foil)" stroke-width="1.55"/>
              <path d="M125 695 L 1065 30" stroke="url(#foilSoft)" stroke-width="1.05" opacity=".45"/>
              <path d="M600 -35 C 840 45, 970 220, 1060 460" stroke="url(#foil)" stroke-width="1.25" opacity=".55"/>
              <path d="M645 -10 C 860 80, 980 250, 1070 490" stroke="url(#foilSoft)" stroke-width=".9" opacity=".35"/>
              <path d="M45 300 C 135 215, 220 185, 305 205" stroke="url(#foilSoft)" stroke-width=".85" opacity=".35"/>
            </g>
          </svg>
        </div>
        <img class="wordmark" src="./vulcet-wordmark.png" alt="Vulcet">
        <div class="chip"></div>
        <svg class="contactless" viewBox="0 0 24 32" fill="none">
          <path d="M8 8c3.5 3 3.5 13 0 16" stroke="#d6d0c4" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M12.5 5c5 4.2 5 17.6 0 22" stroke="#d6d0c4" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M17 2c6.5 5.5 6.5 22 0 28" stroke="#d6d0c4" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <div class="mastercard"><div class="mc-marks"><i></i><i></i></div><span>mastercard</span></div>
      </div>
    </div>
  </div>
</body>
</html>
