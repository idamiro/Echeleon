<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vulcet — Embossed Black Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: #111; }
    .frame {
      width: 1600px;
      height: 1200px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #e4e0d8 0%, #e4e0d8 47.5%, #f1eee8 47.5%, #f4f1eb 100%);
      position: relative;
      overflow: hidden;
    }
    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 30% 70%, rgba(0,0,0,.05), transparent 58%),
        radial-gradient(ellipse 45% 35% at 75% 25%, rgba(255,255,255,.4), transparent 55%);
    }
    .card-wrap {
      position: relative;
      z-index: 1;
      width: 980px;
      height: 618px;
      transform: rotate(-16deg) translate(8px, 4px);
      filter:
        drop-shadow(28px 48px 38px rgba(20,18,14,.28))
        drop-shadow(8px 14px 18px rgba(20,18,14,.14));
    }
    .card {
      width: 100%;
      height: 100%;
      border-radius: 26px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(112deg,
          rgba(255,255,255,.00) 0%,
          rgba(255,255,255,.05) 28%,
          rgba(255,255,255,.00) 44%,
          rgba(255,255,255,.03) 62%,
          rgba(255,255,255,.00) 78%,
          rgba(255,255,255,.04) 92%,
          rgba(255,255,255,.00) 100%),
        radial-gradient(115% 85% at 12% -10%, rgba(255,255,255,.07), transparent 42%),
        linear-gradient(152deg, #1c1b19 0%, #121110 48%, #0a0a09 100%);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), inset 0 -1px 0 rgba(0,0,0,.4);
    }

    /* Large tone-on-tone embossed mark — like SELECT's S */
    .emboss {
      position: absolute;
      left: 64px;
      top: 50%;
      transform: translateY(-58%);
      width: 220px;
      height: 220px;
      border-radius: 40px;
      background:
        linear-gradient(155deg, rgba(255,255,255,.055) 0%, rgba(255,255,255,.015) 42%, rgba(0,0,0,.1) 100%);
      box-shadow:
        3px 4px 6px rgba(0,0,0,.4),
        -1.5px -1.5px 3px rgba(255,255,255,.08),
        inset 0 1px 0 rgba(255,255,255,.1),
        inset 0 -2px 0 rgba(0,0,0,.3);
      display: grid;
      place-items: center;
      gap: 20px;
      padding: 50px 44px;
    }
    .emboss i {
      display: block;
      width: 100%;
      height: 18px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04) 38%, rgba(0,0,0,.16));
      box-shadow:
        0 1px 0 rgba(255,255,255,.1),
        0 3px 4px rgba(0,0,0,.3),
        inset 0 -1px 0 rgba(0,0,0,.25);
    }

    .chip {
      position: absolute;
      right: 280px;
      top: 210px;
      width: 78px;
      height: 60px;
      border-radius: 9px;
      background: linear-gradient(145deg, #ddd8cf, #b0a99d 40%, #ebe6dc 55%, #968f83);
      box-shadow: 0 1px 0 rgba(255,255,255,.35), 0 6px 14px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.18);
      overflow: hidden;
      opacity: .85;
    }
    .chip::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(80,74,64,.5), rgba(80,74,64,.5)) 50% 0 / 1px 100% no-repeat,
        linear-gradient(rgba(80,74,64,.5), rgba(80,74,64,.5)) 0 33% / 100% 1px no-repeat,
        linear-gradient(rgba(80,74,64,.5), rgba(80,74,64,.5)) 0 66% / 100% 1px no-repeat,
        linear-gradient(rgba(80,74,64,.5), rgba(80,74,64,.5)) 28% 0 / 1px 100% no-repeat,
        linear-gradient(rgba(80,74,64,.5), rgba(80,74,64,.5)) 72% 0 / 1px 100% no-repeat;
      opacity: .55;
    }

    .name {
      position: absolute;
      right: 56px;
      bottom: 48px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: .36em;
      text-transform: uppercase;
      color: rgba(242,238,230,.4);
      padding-left: .36em;
    }
    .member {
      position: absolute;
      left: 64px;
      bottom: 52px;
      font-size: 11px;
      font-weight: 550;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(242,238,230,.22);
    }

    .etch {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .5;
    }
    .etch svg { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="frame" id="shot">
    <div class="card-wrap">
      <div class="card">
        <div class="etch" aria-hidden="true">
          <svg viewBox="0 0 980 618" fill="none">
            <path d="M300 650 C 480 280, 680 80, 1040 -40" stroke="rgba(255,255,255,.1)" stroke-width="1"/>
            <path d="M340 670 C 520 300, 720 100, 1080 -20" stroke="rgba(255,255,255,.05)" stroke-width=".7"/>
          </svg>
        </div>
        <div class="emboss" aria-label="Vulcet mark"><i></i><i></i><i></i></div>
        <div class="chip" aria-hidden="true"></div>
        <div class="member">Member</div>
        <div class="name">Vulcet</div>
      </div>
    </div>
  </div>
</body>
</html>
