<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vulcet — Black Metal Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: #0a0a0a; }

    .frame {
      width: 1600px;
      height: 1200px;
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 90% 70% at 50% 45%, #2a2824 0%, #141311 48%, #0c0b0a 100%);
    }
    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 40% at 30% 35%, rgba(201,194,183,.08), transparent 60%),
        radial-gradient(ellipse 40% 30% at 70% 70%, rgba(255,255,255,.03), transparent 55%);
      pointer-events: none;
    }

    .card-wrap {
      position: relative;
      width: 960px;
      height: 605px;
      transform: rotate(-16deg) translate(8px, 6px);
      filter:
        drop-shadow(0 60px 80px rgba(0,0,0,.65))
        drop-shadow(20px 30px 40px rgba(0,0,0,.35));
    }

    .card {
      width: 100%;
      height: 100%;
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      background:
        /* brushed metal sheen */
        linear-gradient(105deg,
          rgba(255,255,255,.00) 0%,
          rgba(255,255,255,.045) 28%,
          rgba(255,255,255,.00) 42%,
          rgba(255,255,255,.025) 58%,
          rgba(255,255,255,.00) 72%,
          rgba(255,255,255,.04) 88%,
          rgba(255,255,255,.00) 100%),
        radial-gradient(120% 90% at 8% -20%, rgba(255,255,255,.11), transparent 38%),
        radial-gradient(90% 70% at 100% 120%, rgba(201,194,183,.06), transparent 45%),
        linear-gradient(155deg, #1c1c1a 0%, #10100e 35%, #080808 70%, #050505 100%);
      border: 1px solid rgba(201,194,183,.18);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -1px 0 rgba(0,0,0,.5),
        inset 1px 0 0 rgba(255,255,255,.04),
        inset -1px 0 0 rgba(0,0,0,.25);
    }

    /* soft edge bevel */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,.07), transparent 35%, transparent 65%, rgba(0,0,0,.2));
      pointer-events: none;
      z-index: 1;
    }

    .etch {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .etch svg { width: 100%; height: 100%; display: block; }

    .chip {
      position: absolute;
      left: 88px;
      top: 198px;
      width: 86px;
      height: 66px;
      border-radius: 10px;
      z-index: 2;
      background:
        linear-gradient(145deg,
          #f0ebe2 0%,
          #c9c2b7 22%,
          #ebe6dc 40%,
          #a8a195 58%,
          #ddd7cd 78%,
          #9a9386 100%);
      box-shadow:
        0 1px 0 rgba(255,255,255,.45),
        0 10px 22px rgba(0,0,0,.45),
        inset 0 0 0 1px rgba(0,0,0,.22),
        inset 0 2px 3px rgba(255,255,255,.35);
      overflow: hidden;
    }
    .chip::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(90,84,74,.55), rgba(90,84,74,.55)) 50% 0 / 1.2px 100% no-repeat,
        linear-gradient(rgba(90,84,74,.55), rgba(90,84,74,.55)) 0 30% / 100% 1.2px no-repeat,
        linear-gradient(rgba(90,84,74,.55), rgba(90,84,74,.55)) 0 70% / 100% 1.2px no-repeat,
        linear-gradient(rgba(90,84,74,.55), rgba(90,84,74,.55)) 26% 0 / 1.2px 100% no-repeat,
        linear-gradient(rgba(90,84,74,.55), rgba(90,84,74,.55)) 74% 0 / 1.2px 100% no-repeat;
      opacity: .7;
    }
    .chip::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,.35), transparent 40%, transparent 60%, rgba(255,255,255,.12));
      pointer-events: none;
    }

    .wordmark {
      position: absolute;
      top: 62px;
      right: 72px;
      width: 280px;
      height: auto;
      z-index: 2;
      filter:
        invert(1)
        brightness(1.05)
        drop-shadow(0 1px 0 rgba(255,255,255,.15))
        drop-shadow(0 0 12px rgba(242,238,230,.12));
      opacity: .98;
    }

    .contactless {
      position: absolute;
      left: 198px;
      top: 210px;
      width: 32px;
      height: 42px;
      opacity: .62;
      z-index: 2;
      filter: drop-shadow(0 0 4px rgba(201,194,183,.25));
    }

    .mastercard {
      position: absolute;
      right: 72px;
      bottom: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 2;
    }
    .mc-marks {
      position: relative;
      width: 96px;
      height: 58px;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.35));
    }
    .mc-marks i {
      position: absolute;
      top: 0;
      width: 58px;
      height: 58px;
      border-radius: 50%;
    }
    .mc-marks i:first-child {
      left: 0;
      background:
        radial-gradient(circle at 30% 28%, #f4efe6, #c9c2b7 45%, #8f877b 100%);
      opacity: .92;
    }
    .mc-marks i:last-child {
      right: 0;
      background:
        radial-gradient(circle at 35% 30%, #ddd7cd, #a8a195 48%, #6f695f 100%);
      opacity: .78;
    }
    .mastercard span {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .06em;
      color: rgba(201,194,183,.55);
      text-transform: lowercase;
    }
  </style>
</head>
<body>
  <div class="frame" id="shot">
    <div class="card-wrap">
      <div class="card">
        <div class="etch" aria-hidden="true">
          <svg viewBox="0 0 960 605" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#f7f3ea" stop-opacity=".85"/>
                <stop offset="35%" stop-color="#c9c2b7" stop-opacity=".42"/>
                <stop offset="70%" stop-color="#ebe6dc" stop-opacity=".55"/>
                <stop offset="100%" stop-color="#a8a195" stop-opacity=".7"/>
              </linearGradient>
              <linearGradient id="foilSoft" x1="1" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#efebe3" stop-opacity=".5"/>
                <stop offset="100%" stop-color="#c9c2b7" stop-opacity=".15"/>
              </linearGradient>
              <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="0.6" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <!-- Large etched arc family — metal engraving feel -->
            <g filter="url(#glow)" stroke-linecap="round">
              <path d="M-80 560 C 0 40, 280 -100, 620 50" stroke="url(#foil)" stroke-width="1.6"/>
              <path d="M-40 575 C 50 80, 310 -70, 650 80" stroke="url(#foil)" stroke-width="1.15" opacity=".55"/>
              <path d="M10 590 C 100 120, 340 -40, 680 110" stroke="url(#foilSoft)" stroke-width=".9" opacity=".4"/>

              <!-- Primary diagonal -->
              <path d="M70 620 L 940 10" stroke="url(#foil)" stroke-width="1.5"/>
              <path d="M110 635 L 980 25" stroke="url(#foilSoft)" stroke-width="1" opacity=".45"/>

              <!-- Counter arc top-right -->
              <path d="M560 -30 C 780 40, 900 200, 980 420" stroke="url(#foil)" stroke-width="1.2" opacity=".55"/>
              <path d="M600 -10 C 800 70, 910 230, 990 450" stroke="url(#foilSoft)" stroke-width=".85" opacity=".35"/>

              <!-- Micro accent near chip zone -->
              <path d="M40 280 C 120 200, 200 170, 280 190" stroke="url(#foilSoft)" stroke-width=".8" opacity=".35"/>
            </g>
          </svg>
        </div>

        <img class="wordmark" src="./vulcet-wordmark.png" alt="Vulcet">
        <div class="chip" aria-hidden="true"></div>
        <svg class="contactless" viewBox="0 0 24 32" fill="none" aria-hidden="true">
          <path d="M8 8c3.5 3 3.5 13 0 16" stroke="#d6d0c4" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M12.5 5c5 4.2 5 17.6 0 22" stroke="#d6d0c4" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M17 2c6.5 5.5 6.5 22 0 28" stroke="#d6d0c4" stroke-width="1.6" stroke-linecap="round"/>
        </svg>

        <div class="mastercard" aria-label="Mastercard">
          <div class="mc-marks"><i></i><i></i></div>
          <span>mastercard</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
