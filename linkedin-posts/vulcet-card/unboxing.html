<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vulcet — Card Unboxing</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: #111; }

    .frame {
      width: 1600px;
      height: 1200px;
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #cfcbc3;
    }

    .surface {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 61.8%, rgba(176,118,88,.4) 61.95%, rgba(176,118,88,.15) 62.2%, transparent 62.45%),
        linear-gradient(180deg, rgba(255,255,255,.2) 0%, transparent 28%, rgba(0,0,0,.05) 100%),
        linear-gradient(145deg, #d9d5ce 0%, #c8c3ba 50%, #b8b2a8 100%);
    }
    .surface::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 45% 40%, rgba(255,255,255,.14), transparent 55%),
        radial-gradient(ellipse 45% 40% at 78% 75%, rgba(0,0,0,.07), transparent 60%);
    }

    .stage {
      position: relative;
      z-index: 2;
      width: 1240px;
      height: 780px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 36px;
      padding-bottom: 56px;
    }

    /* Welcome insert */
    .insert {
      width: 300px;
      height: 460px;
      border-radius: 3px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      background: linear-gradient(165deg, #171715 0%, #0c0c0b 100%);
      box-shadow: 16px 24px 44px rgba(0,0,0,.26);
      transform: translateY(-36px) rotate(-1.2deg);
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .insert-mark {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 140px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      gap: 14px;
      padding: 32px 28px;
      background: rgba(255,255,255,.03);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
      opacity: .35;
    }
    .insert-mark i {
      display: block;
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.5);
    }
    .insert p {
      position: relative;
      z-index: 1;
      color: rgba(242,238,230,.72);
      font-size: 20px;
      line-height: 1.45;
      font-weight: 450;
      max-width: 220px;
    }
    .insert p strong {
      display: block;
      margin-top: 4px;
      color: rgba(242,238,230,.95);
      font-weight: 560;
    }

    /* Wide shallow presentation tray — like SELECT */
    .box {
      width: 720px;
      height: 420px;
      position: relative;
      flex-shrink: 0;
      border-radius: 4px;
      background: linear-gradient(160deg, #2c2b28 0%, #1a1917 45%, #141312 100%);
      box-shadow:
        22px 32px 55px rgba(0,0,0,.3),
        0 1px 0 rgba(255,255,255,.07) inset,
        0 -1px 0 rgba(0,0,0,.45) inset;
      padding: 28px 32px 32px;
      display: flex;
      flex-direction: column;
    }

    .box-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      min-height: 28px;
    }
    .box-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .box-brand .mini-mark {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.08);
      display: grid;
      place-items: center;
      gap: 2.8px;
      padding: 6px 5.5px;
    }
    .box-brand .mini-mark i {
      display: block;
      width: 100%;
      height: 2.8px;
      border-radius: 999px;
      background: rgba(242,238,230,.65);
    }
    .box-brand span {
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: rgba(242,238,230,.55);
      padding-left: .3em;
    }

    /* Flush recessed well */
    .well {
      flex: 1;
      border-radius: 6px;
      background: #0d0d0c;
      box-shadow:
        inset 0 10px 22px rgba(0,0,0,.55),
        inset 0 2px 0 rgba(0,0,0,.8),
        inset 0 -1px 0 rgba(255,255,255,.025);
      padding: 18px 22px;
      display: grid;
      place-items: center;
    }

    .card {
      width: 100%;
      max-width: 620px;
      aspect-ratio: 1.586 / 1;
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(100% 80% at 15% 0%, rgba(255,255,255,.035), transparent 50%),
        linear-gradient(155deg, #1c1b19 0%, #131211 50%, #0e0d0c 100%);
      box-shadow:
        0 1px 2px rgba(0,0,0,.4),
        0 6px 16px rgba(0,0,0,.2),
        inset 0 1px 0 rgba(255,255,255,.06);
    }

    /* Tone-on-tone emboss — material, not print */
    .emboss {
      position: absolute;
      left: 48px;
      top: 42%;
      transform: translateY(-50%);
      width: 132px;
      height: 132px;
      border-radius: 24px;
      background: linear-gradient(155deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.012) 45%, rgba(0,0,0,.1) 100%);
      box-shadow:
        2px 3px 5px rgba(0,0,0,.38),
        -1px -1px 2px rgba(255,255,255,.07),
        inset 0 1px 0 rgba(255,255,255,.09),
        inset 0 -1px 0 rgba(0,0,0,.28);
      display: grid;
      place-items: center;
      gap: 12px;
      padding: 30px 26px;
    }
    .emboss i {
      display: block;
      width: 100%;
      height: 11px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.03) 40%, rgba(0,0,0,.14));
      box-shadow:
        0 1px 0 rgba(255,255,255,.09),
        0 2px 3px rgba(0,0,0,.28),
        inset 0 -1px 0 rgba(0,0,0,.22);
    }

    .card-name {
      position: absolute;
      right: 40px;
      bottom: 28px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: rgba(242,238,230,.38);
      padding-left: .32em;
    }
    .card-member {
      position: absolute;
      left: 48px;
      bottom: 30px;
      font-size: 9px;
      font-weight: 550;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(242,238,230,.18);
    }

    .card-etch {
      position: absolute;
      inset: 0;
      opacity: .4;
      pointer-events: none;
    }
    .card-etch svg { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="frame" id="shot">
    <div class="surface" aria-hidden="true"></div>
    <div class="stage">
      <div class="insert">
        <div class="insert-mark" aria-hidden="true"><i></i><i></i><i></i></div>
        <p>Welcome to the studio.<strong>Welcome to Vulcet.</strong></p>
      </div>

      <div class="box">
        <div class="box-top">
          <div class="box-brand">
            <div class="mini-mark" aria-hidden="true"><i></i><i></i><i></i></div>
            <span>Vulcet</span>
          </div>
        </div>
        <div class="well">
          <div class="card">
            <div class="card-etch" aria-hidden="true">
              <svg viewBox="0 0 620 391" fill="none">
                <path d="M260 420 C 380 160, 500 40, 700 -40" stroke="rgba(255,255,255,.1)" stroke-width=".9"/>
                <path d="M290 430 C 410 180, 530 55, 730 -30" stroke="rgba(255,255,255,.05)" stroke-width=".65"/>
              </svg>
            </div>
            <div class="emboss" aria-label="Vulcet mark"><i></i><i></i><i></i></div>
            <div class="card-member">Member</div>
            <div class="card-name">Vulcet</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
