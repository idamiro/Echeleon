  <main class="shell">
    <section class="stage" id="stage" data-view="carousel">
      <div class="stage-tilt" id="tiltRoot">
        <div class="stage-card" id="stageCard">
          <!-- CARD CHROME -->
          <div class="card-chrome">
            <button type="button" class="mark" id="homeBtn" aria-label="Back to carousel">
              <svg viewBox="0 0 32 16" width="36" height="18" aria-hidden="true"><path d="M2 8h20M16 3l6 5-6 5" fill="none" stroke="currentColor" stroke-width="2"></path></svg>
              <span>KC</span>
            </button>
            <nav class="seg" aria-label="Audience">
              <button type="button" class="seg-btn is-active" data-seg="women">Women</button>
              <button type="button" class="seg-btn" data-seg="men">Men</button>
              <button type="button" class="seg-btn" data-seg="kids">Kids</button>
            </nav>
            <div class="chrome-actions">
              <button type="button" class="icon-btn" aria-label="Search">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3-3"></path></svg>
              </button>
              <button type="button" class="icon-btn" aria-label="Bag">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8h15l-1.5 9h-12z"></path><circle cx="9" cy="20" r="1.5"></circle><circle cx="17" cy="20" r="1.5"></circle><path d="M6 8L5 4H2"></path></svg>
              </button>
            </div>
          </div>

          <!-- VIEW: CAROUSEL -->
          <div class="view view-carousel is-active" id="viewCarousel" data-panel="carousel">
            <div class="carousel" id="carousel">
              <!-- filled by JS -->
            </div>
            <div class="carousel-dots" id="carouselDots" aria-label="Product pagination"></div>
          </div>

          <!-- VIEW: DETAIL -->
          <div class="view view-detail" id="viewDetail" data-panel="detail" hidden="">
            <p class="ghost-name" id="ghostName" aria-hidden="true">PULSE</p>
            <div class="detail-grid">
              <div class="detail-info">
                <p class="micro" id="detailLine">Race line</p>
                <h1 id="detailTitle">Vaporstride Pulse</h1>
                <div class="size-row" id="sizeRow" role="listbox" aria-label="Select size"></div>
                <div class="swatches" id="swatches" role="listbox" aria-label="Select colorway"></div>
              </div>
              <div class="detail-hero">
                <img id="detailShoe" class="float-shoe" src="/redesigns/nike/assets/nike/catalog/w-af1-white.webp" alt="Vaporstride Pulse">
              </div>
            </div>
            <div class="detail-bar">
              <button type="button" class="price-pill" id="pricePill">$240.00</button>
              <button type="button" class="cta-pill" id="preorderBtn">Pre-order</button>
            </div>
            <button type="button" class="scroll-hint" id="openSizes" aria-label="Open size selection">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"></path></svg>
            </button>
          </div>

          <!-- VIEW: SIZES -->
          <div class="view view-sizes" id="viewSizes" data-panel="sizes" hidden="">
            <button type="button" class="back-chip" id="backDetail">← Back</button>
            <div class="sizes-layout">
              <div class="angle-grid" id="angleGrid">
                <img src="/redesigns/nike/assets/nike/catalog/w-af1-white.webp" alt="Vulcet">
                <img src="/redesigns/nike/assets/nike/catalog/w-af1-white.webp" alt="">
                <img src="/redesigns/nike/assets/nike/catalog/w-af1-black.webp" alt="">
                <img src="/redesigns/nike/assets/nike/catalog/w-af1-pink.webp" alt="">
              </div>
              <div class="sizes-panel">
                <div class="sizes-head">
                  <h2>Select Size</h2>
                  <button type="button" class="textish">Size Guide</button>
                </div>
                <div class="size-grid" id="sizeGrid" role="listbox" aria-label="UK sizes"></div>
                <button type="button" class="customize">Customize</button>
                <button type="button" class="buy-btn" id="buyBtn">Add to bag</button>
                <p class="fineprint">Unofficial Vulcet concept. Fictional product — not for sale.</p>
              </div>
            </div>
          </div>
        </div>
