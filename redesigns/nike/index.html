<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="index,follow">
  <title>Nike Concept Stage — Vulcet Redesign Experiment</title>
  <meta name="description" content="Interactive unofficial Nike product-stage concept by Vulcet. Real Nike models across Women, Men and Kids with color-reactive backgrounds.">
  <link rel="canonical" href="https://vulcet.com/redesigns/nike/">
  <meta property="og:title" content="Vaporstride — Vulcet Redesign Experiment">
  <meta property="og:description" content="An unofficial interactive product concept by Vulcet.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://vulcet.com/redesigns/nike/">
  <meta property="og:image" content="https://vulcet.com/redesigns/nike/assets/nike/catalog/w-af1-white.webp">
  <meta name="theme-color" content="#f4b8a4">
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260812-cutout5">
</head>
<body>
  <a class="skip" href="#stage">Skip to content</a>

  <div class="page-bg" aria-hidden="true"></div>

  <header class="page-top">
    <a class="brand" href="../">Vulcet <span>Experiment</span></a>
    <p class="disclaimer">Unofficial concept · Not affiliated with Nike, Inc.</p>
    <a class="top-link" href="../../">Studio</a>
  </header>

  <main class="shell">
    <section class="stage" id="stage" data-view="carousel">
      <div class="stage-tilt" id="tiltRoot">
        <div class="stage-card" id="stageCard">
          <!-- CARD CHROME -->
          <div class="card-chrome">
            <button type="button" class="mark" id="homeBtn" aria-label="Back to carousel">
              <svg viewBox="0 0 32 16" width="36" height="18" aria-hidden="true"><path d="M2 8h20M16 3l6 5-6 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
              <span>KC</span>
            </button>
            <nav class="seg" aria-label="Audience">
              <button type="button" class="seg-btn is-active" data-seg="women">Women</button>
              <button type="button" class="seg-btn" data-seg="men">Men</button>
              <button type="button" class="seg-btn" data-seg="kids">Kids</button>
            </nav>
            <div class="chrome-actions">
              <button type="button" class="icon-btn" aria-label="Search">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
              </button>
              <button type="button" class="icon-btn" aria-label="Bag">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/><path d="M6 8L5 4H2"/></svg>
              </button>
            </div>
          </div>

          <!-- VIEW: CAROUSEL -->
          <div class="view view-carousel is-active" id="viewCarousel" data-panel="carousel">
            <div class="carousel" id="carousel">
              <!-- filled by JS -->
            </div>
            <div class="carousel-dots" id="carouselDots" aria-label="Product pagination"></div>
          </div>

          <!-- VIEW: DETAIL -->
          <div class="view view-detail" id="viewDetail" data-panel="detail" hidden>
            <p class="ghost-name" id="ghostName" aria-hidden="true">PULSE</p>
            <div class="detail-grid">
              <div class="detail-info">
                <p class="micro" id="detailLine">Race line</p>
                <h1 id="detailTitle">Vaporstride Pulse</h1>
                <div class="size-row" id="sizeRow" role="listbox" aria-label="Select size"></div>
                <div class="swatches" id="swatches" role="listbox" aria-label="Select colorway"></div>
              </div>
              <div class="detail-hero">
                <img id="detailShoe" class="float-shoe" src="assets/nike/catalog/w-af1-white.webp" alt="Vaporstride Pulse">
              </div>
            </div>
            <div class="detail-bar">
              <button type="button" class="price-pill" id="pricePill">$240.00</button>
              <button type="button" class="cta-pill" id="preorderBtn">Pre-order</button>
            </div>
            <button type="button" class="scroll-hint" id="openSizes" aria-label="Open size selection">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>
          </div>

          <!-- VIEW: SIZES -->
          <div class="view view-sizes" id="viewSizes" data-panel="sizes" hidden>
            <button type="button" class="back-chip" id="backDetail">← Back</button>
            <div class="sizes-layout">
              <div class="angle-grid" id="angleGrid">
                <img src="assets/nike/catalog/w-af1-white.webp" alt="">
                <img src="assets/nike/catalog/w-af1-white.webp" alt="">
                <img src="assets/nike/catalog/w-af1-black.webp" alt="">
                <img src="assets/nike/catalog/w-af1-pink.webp" alt="">
              </div>
              <div class="sizes-panel">
                <div class="sizes-head">
                  <h2>Select Size</h2>
                  <button type="button" class="textish">Size Guide</button>
                </div>
                <div class="size-grid" id="sizeGrid" role="listbox" aria-label="UK sizes"></div>
                <button type="button" class="customize">Customize</button>
                <button type="button" class="buy-btn" id="buyBtn">Add to bag</button>
                <p class="fineprint">Unofficial Vulcet concept. Fictional product — not for sale.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="page-foot">
    <p>Experiment by <a href="../../">Vulcet</a> · Kinetic Clarity · <a href="../">All redesigns</a></p>
  </footer>

  <script src="app.js?v=20260812-cutout5"></script>
</body>
</html>
